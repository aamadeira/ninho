services:
  ninho:
    image: ghcr.io/aamadeira/ninho:latest
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      TZ: Europe/Lisbon
      DISABLED_FEATURES: "" # e.g. "recipes,calendar"
      PUID: 1000
      PGID: 1000
    volumes:
      - ninho:/srv/ninho/data

volumes:
  ninho:
